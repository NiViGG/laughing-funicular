<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Mycelium AI</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #080c12;
    color: #e0e0e0;
    font-family: 'Courier New', monospace;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  #header {
    display: flex;
    align-items: center;
    padding: 12px 16px;
    border-bottom: 1px solid #1a2030;
    background: #0d1117;
  }
  #header .logo {
    color: #00ff88;
    font-size: 20px;
    margin-right: 10px;
  }
  #header h1 {
    font-size: 16px;
    color: #00ff88;
    font-weight: normal;
    letter-spacing: 2px;
  }
  #header .status {
    margin-left: auto;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #00ff88;
    box-shadow: 0 0 6px #00ff88;
    animation: pulse 2s infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }
  #chat {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  #chat::-webkit-scrollbar { width: 4px; }
  #chat::-webkit-scrollbar-track { background: transparent; }
  #chat::-webkit-scrollbar-thumb { background: #1a2030; border-radius: 2px; }
  .message {
    max-width: 85%;
    padding: 10px 14px;
    border-radius: 12px;
    font-size: 14px;
    line-height: 1.5;
    word-break: break-word;
  }
  .message.user {
    align-self: flex-end;
    background: #0d2818;
    border: 1px solid #00ff8840;
    color: #c8ffd8;
  }
  .message.assistant {
    align-self: flex-start;
    background: #0d1117;
    border: 1px solid #1a2030;
    color: #e0e0e0;
  }
  .message.assistant .sender {
    color: #00ff88;
    font-size: 11px;
    margin-bottom: 4px;
    letter-spacing: 1px;
  }
  .message.system {
    align-self: center;
    background: transparent;
    color: #3a4a5a;
    font-size: 12px;
    text-align: center;
    border: none;
    padding: 4px;
  }
  #commands {
    display: flex;
    gap: 8px;
    padding: 8px 16px;
    overflow-x: auto;
    border-top: 1px solid #1a2030;
  }
  #commands::-webkit-scrollbar { display: none; }
  .cmd-btn {
    flex-shrink: 0;
    padding: 6px 12px;
    background: #0d1117;
    border: 1px solid #1a2030;
    border-radius: 16px;
    color: #7090a0;
    font-size: 12px;
    cursor: pointer;
    font-family: inherit;
    transition: all 0.2s;
  }
  .cmd-btn:active {
    background: #0d2818;
    border-color: #00ff8840;
    color: #00ff88;
  }
  #input-area {
    display: flex;
    align-items: center;
    padding: 12px 16px;
    gap: 10px;
    background: #0d1117;
    border-top: 1px solid #1a2030;
  }
  #message-input {
    flex: 1;
    background: #080c12;
    border: 1px solid #1a2030;
    border-radius: 20px;
    padding: 10px 16px;
    color: #e0e0e0;
    font-family: inherit;
    font-size: 14px;
    outline: none;
    resize: none;
    max-height: 100px;
    line-height: 1.4;
  }
  #message-input:focus { border-color: #00ff8840; }
  #message-input::placeholder { color: #3a4a5a; }
  .icon-btn {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    border: 1px solid #1a2030;
    background: #0d1117;
    color: #7090a0;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    transition: all 0.2s;
    flex-shrink: 0;
  }
  .icon-btn:active, .icon-btn.active {
    background: #0d2818;
    border-color: #00ff8840;
    color: #00ff88;
  }
  #voice-btn.recording {
    background: #1a0808;
    border-color: #ff004440;
    color: #ff4444;
    animation: recordPulse 1s infinite;
  }
  @keyframes recordPulse {
    0%, 100% { box-shadow: none; }
    50% { box-shadow: 0 0 8px #ff4444; }
  }
  #api-settings {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(8,12,18,0.95);
    z-index: 100;
    padding: 20px;
    flex-direction: column;
    gap: 16px;
  }
  #api-settings.open { display: flex; }
  #api-settings h2 { color: #00ff88; font-size: 16px; letter-spacing: 2px; }
  #api-settings label { color: #7090a0; font-size: 12px; margin-bottom: 4px; display: block; }
  #api-settings input, #api-settings select {
    width: 100%;
    background: #0d1117;
    border: 1px solid #1a2030;
    border-radius: 8px;
    padding: 10px 12px;
    color: #e0e0e0;
    font-family: inherit;
    font-size: 14px;
    outline: none;
  }
  #api-settings input:focus, #api-settings select:focus { border-color: #00ff8840; }
  .settings-btn {
    padding: 10px 20px;
    border-radius: 8px;
    border: none;
    font-family: inherit;
    font-size: 14px;
    cursor: pointer;
  }
  .settings-btn.primary { background: #00ff8820; border: 1px solid #00ff8840; color: #00ff88; }
  .settings-btn.secondary { background: transparent; border: 1px solid #1a2030; color: #7090a0; }
  .typing-indicator {
    display: flex;
    gap: 4px;
    padding: 10px 14px;
    align-self: flex-start;
    background: #0d1117;
    border: 1px solid #1a2030;
    border-radius: 12px;
  }
  .typing-indicator span {
    width: 6px; height: 6px;
    background: #00ff88;
    border-radius: 50%;
    animation: typing 1.2s infinite;
  }
  .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
  .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes typing {
    0%, 60%, 100% { opacity: 0.2; transform: translateY(0); }
    30% { opacity: 1; transform: translateY(-4px); }
  }
</style>
</head>
<body>

<div id="header">
  <span class="logo">✦</span>
  <h1>MYCELIUM AI</h1>
  <div class="status"></div>
  <button class="icon-btn" id="settings-btn" style="margin-left:10px;width:32px;height:32px;font-size:14px;" onclick="openSettings()">⚙</button>
</div>

<div id="chat"></div>

<div id="commands">
  <button class="cmd-btn" onclick="sendQuick('Что ты умеешь?')">Возможности</button>
  <button class="cmd-btn" onclick="sendQuick('Помоги мне с кодом')">Код</button>
  <button class="cmd-btn" onclick="sendQuick('Объясни простыми словами')">Объяснение</button>
  <button class="cmd-btn" onclick="sendQuick('Придумай идею')">Идеи</button>
  <button class="cmd-btn" onclick="clearChat()">Очистить</button>
</div>

<div id="input-area">
  <button class="icon-btn" id="voice-btn" onclick="toggleVoice()">🎙</button>
  <textarea id="message-input" rows="1" placeholder="Сообщение..." onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
  <button class="icon-btn" onclick="sendMessage()">➤</button>
</div>

<div id="api-settings">
  <h2>⚙ НАСТРОЙКИ</h2>
  <div>
    <label>API Key (Anthropic Claude)</label>
    <input type="password" id="api-key-input" placeholder="sk-ant-...">
  </div>
  <div>
    <label>Модель</label>
    <select id="model-select">
      <option value="claude-3-5-sonnet-20241022">Claude 3.5 Sonnet</option>
      <option value="claude-3-5-haiku-20241022">Claude 3.5 Haiku</option>
      <option value="claude-3-opus-20240229">Claude 3 Opus</option>
    </select>
  </div>
  <div>
    <label>Системный промпт</label>
    <textarea id="system-prompt-input" rows="4" style="width:100%;background:#0d1117;border:1px solid #1a2030;border-radius:8px;padding:10px;color:#e0e0e0;font-family:inherit;font-size:13px;outline:none;resize:vertical;"></textarea>
  </div>
  <div style="display:flex;gap:10px;margin-top:auto;">
    <button class="settings-btn primary" onclick="saveSettings()">Сохранить</button>
    <button class="settings-btn secondary" onclick="closeSettings()">Отмена</button>
  </div>
</div>

<script>
const DB = {
  get: k => localStorage.getItem(k),
  set: (k, v) => localStorage.setItem(k, v),
};

let messages = [];
let isRecording = false;
let recognition = null;
let apiKey = DB.get('apiKey') || '';
let model = DB.get('model') || 'claude-3-5-sonnet-20241022';
let systemPrompt = DB.get('systemPrompt') || 'Ты — Mycelium AI, умный и дружелюбный ассистент. Отвечай кратко и по существу.';

function addMessage(role, text) {
  const chat = document.getElementById('chat');
  const div = document.createElement('div');
  div.className = 'message ' + role;
  if (role === 'assistant') {
    div.innerHTML = '<div class="sender">✦ MYCELIUM</div>' + escapeHtml(text).replace(/\n/g, '<br>');
  } else if (role === 'system') {
    div.textContent = text;
  } else {
    div.textContent = text;
  }
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
  return div;
}

function escapeHtml(t) {
  return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function showTyping() {
  const chat = document.getElementById('chat');
  const div = document.createElement('div');
  div.className = 'typing-indicator';
  div.id = 'typing';
  div.innerHTML = '<span></span><span></span><span></span>';
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

function hideTyping() {
  const el = document.getElementById('typing');
  if (el) el.remove();
}

async function sendMessage() {
  const input = document.getElementById('message-input');
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  input.style.height = 'auto';

  if (!apiKey) {
    addMessage('system', '⚠ Укажите API Key в настройках ⚙');
    openSettings();
    return;
  }

  messages.push({ role: 'user', content: text });
  addMessage('user', text);
  showTyping();

  try {
    const resp = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'x-api-key': apiKey,
        'anthropic-version': '2023-06-01',
      },
      body: JSON.stringify({
        model,
        max_tokens: 1024,
        system: systemPrompt,
        messages,
      }),
    });
    const data = await resp.json();
    hideTyping();
    if (data.content && data.content[0]) {
      const reply = data.content[0].text;
      messages.push({ role: 'assistant', content: reply });
      addMessage('assistant', reply);
      if (window.AndroidBridge) AndroidBridge.vibrate(30);
    } else if (data.error) {
      addMessage('system', '✗ Ошибка: ' + data.error.message);
    }
  } catch (e) {
    hideTyping();
    addMessage('system', '✗ Нет соединения: ' + e.message);
  }
}

function sendQuick(text) {
  document.getElementById('message-input').value = text;
  sendMessage();
}

function clearChat() {
  messages = [];
  document.getElementById('chat').innerHTML = '';
  addMessage('system', '— чат очищен —');
}

function handleKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
}

function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 100) + 'px';
}

function toggleVoice() {
  if (!('webkitSpeechRecognition' in window || 'SpeechRecognition' in window)) {
    if (window.AndroidBridge) AndroidBridge.toast('Голосовой ввод недоступен');
    return;
  }
  if (isRecording) {
    recognition && recognition.stop();
    return;
  }
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  recognition = new SR();
  recognition.lang = 'ru-RU';
  recognition.interimResults = false;
  recognition.onstart = () => {
    isRecording = true;
    document.getElementById('voice-btn').classList.add('recording');
  };
  recognition.onend = () => {
    isRecording = false;
    document.getElementById('voice-btn').classList.remove('recording');
  };
  recognition.onresult = e => {
    const t = e.results[0][0].transcript;
    document.getElementById('message-input').value = t;
    sendMessage();
  };
  recognition.start();
}

function openSettings() {
  document.getElementById('api-key-input').value = apiKey;
  document.getElementById('model-select').value = model;
  document.getElementById('system-prompt-input').value = systemPrompt;
  document.getElementById('api-settings').classList.add('open');
}

function closeSettings() {
  document.getElementById('api-settings').classList.remove('open');
}

function saveSettings() {
  apiKey = document.getElementById('api-key-input').value.trim();
  model = document.getElementById('model-select').value;
  systemPrompt = document.getElementById('system-prompt-input').value.trim() || systemPrompt;
  DB.set('apiKey', apiKey);
  DB.set('model', model);
  DB.set('systemPrompt', systemPrompt);
  closeSettings();
  addMessage('system', '✓ Настройки сохранены');
}

// Init
addMessage('system', '✦ Mycelium AI готов к работе');
if (!apiKey) setTimeout(() => addMessage('system', 'Откройте ⚙ и введите API Key для начала работы'), 800);
</script>
</body>
</html>
